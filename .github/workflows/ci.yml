name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rec_food:rec_food_ci_password@localhost:5432/rec_food?schema=public
      JWT_ACCESS_SECRET: ci-jwt-access-secret-that-is-long-enough
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      SEED_ADMIN_EMAIL: admin@rec-food.local
      SEED_ADMIN_PASSWORD: ci-admin-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rec_food
          POSTGRES_USER: rec_food
          POSTGRES_PASSWORD: rec_food_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rec_food -d rec_food"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Verify migrations from empty isolated schema
        run: node scripts/check-migrations.mjs

      - name: Seed database
        run: npm run db:seed

      - name: Test
        run: npm test

      - name: Database test
        run: npm run test:db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
        env:
          PLAYWRIGHT_PREVIEW: "true"
      - name: Docker image builds
        working-directory: .
        run: |
          docker build --target production -t rec-food-backend:ci backend
          docker build -t rec-food-frontend:ci frontend

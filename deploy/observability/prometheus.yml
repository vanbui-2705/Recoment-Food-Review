global:
  scrape_interval: 30s
  scrape_timeout: 10s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: rec-food
    metrics_path: /admin/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_access_token
    static_configs:
      - targets: ["backend:3001"]

services:
  postgres:
    image: postgres:17-alpine
    container_name: rec-food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rec_food
      POSTGRES_USER: rec_food
      POSTGRES_PASSWORD: rec_food_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rec_food_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec_food -d rec_food"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rec_food_postgres_data:

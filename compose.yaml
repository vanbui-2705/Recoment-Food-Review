x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://rec_food:${POSTGRES_PASSWORD:-rec_food_dev_password}@postgres:5432/rec_food?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set for production}
  SECURITY_NAMESPACE: ${SECURITY_NAMESPACE:-rec-food}
  TRUST_PROXY_IPS: ${TRUST_PROXY_IPS:-}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  THEMEALDB_API_KEY: ${THEMEALDB_API_KEY:-}
  SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
  GOONG_API_KEY: ${GOONG_API_KEY:-}
  FOURSQUARE_API_KEY: ${FOURSQUARE_API_KEY:-}
  GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
  PROVIDER_REQUESTS_PER_MINUTE: ${PROVIDER_REQUESTS_PER_MINUTE:-120}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LLM_INPUT_MAX_BYTES: ${LLM_INPUT_MAX_BYTES:-65536}
  LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-200}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-10}
  LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-1.5}
  LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-7.5}
  LLM_PRICING_VALID_UNTIL: ${LLM_PRICING_VALID_UNTIL:-2027-01-01}
  WORKER_ENABLED: ${WORKER_ENABLED:-false}
  MENU_SYNC_WORKER_ENABLED: ${MENU_SYNC_WORKER_ENABLED:-false}
  CHAT_RUN_TIMEOUT_MS: ${CHAT_RUN_TIMEOUT_MS:-90000}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-90}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
  EMAIL_ALLOWED_ORIGINS: ${EMAIL_ALLOWED_ORIGINS:-}
  EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:-}
  EMAIL_TIMEOUT_MS: ${EMAIL_TIMEOUT_MS:-10000}
  RECOMMENDATION_WEIGHT_TASTE: ${RECOMMENDATION_WEIGHT_TASTE:-35}
  RECOMMENDATION_WEIGHT_CUISINE: ${RECOMMENDATION_WEIGHT_CUISINE:-10}
  RECOMMENDATION_WEIGHT_DISTANCE: ${RECOMMENDATION_WEIGHT_DISTANCE:-20}
  RECOMMENDATION_WEIGHT_BUDGET: ${RECOMMENDATION_WEIGHT_BUDGET:-15}
  RECOMMENDATION_WEIGHT_RATING: ${RECOMMENDATION_WEIGHT_RATING:-10}
  RECOMMENDATION_WEIGHT_NOVELTY: ${RECOMMENDATION_WEIGHT_NOVELTY:-10}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rec_food
      POSTGRES_USER: rec_food
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rec_food_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rec_food_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec_food -d rec_food"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://rec_food:${POSTGRES_PASSWORD:-rec_food_dev_password}@postgres:5432/rec_food?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rec_food:${POSTGRES_PASSWORD:-rec_food_dev_password}@postgres:5432/rec_food?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    init: true
    stop_grace_period: 120s
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      HOST: 0.0.0.0
      PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    init: true
    stop_grace_period: 180s
    build:
      context: ./backend
      target: production
    command: ["node", "dist/worker.js"]
    profiles: ["background", "ai"]
    restart: on-failure
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rec_food_postgres_data:

# Disposable project only: no host database/API ports and no production credentials.
services:
  postgres:
    ports: !reset []
  migrate:
    image: rec-food-migrate:plan-ops
  backend:
    image: ${DRILL_CURRENT_IMAGE:-rec-food-backend:plan-sync}
    ports: !reset []
  worker:
    image: ${DRILL_CURRENT_IMAGE:-rec-food-backend:plan-sync}
  frontend:
    image: ${DRILL_FRONTEND_IMAGE:-rec-food-frontend:plan-sync}
    ports: !override ["127.0.0.1::80"]

<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EatWise AI - Khám Phá Món Ngon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: "#ff5a5f",
            secondary: "#00a699",
            surface: "#f7f7f9",
            card: "#ffffff",
          },
          animation: {
            'like': 'likeAnim 0.5s ease-out forwards',
            'nope': 'nopeAnim 0.5s ease-out forwards',
          },
          keyframes: {
            likeAnim: {
              '0%': { transform: 'scale(1) rotate(0deg)' },
              '50%': { transform: 'scale(1.1) rotate(15deg)' },
              '100%': { transform: 'scale(0) rotate(30deg)', opacity: '0' },
            },
            nopeAnim: {
              '0%': { transform: 'scale(1) rotate(0deg)' },
              '50%': { transform: 'scale(1.1) rotate(-15deg)' },
              '100%': { transform: 'scale(0) rotate(-30deg)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f7f7f9;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tinder-cards {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tinder-card {
      position: absolute;
      width: calc(100% - 32px);
      max-width: 420px;
      height: calc(100% - 32px);
      max-height: 600px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      will-change: transform;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .tinder-card.moving {
      transition: none;
      cursor: grabbing;
    }

    .tinder-card img {
      width: 100%;
      height: 65%;
      object-fit: cover;
      pointer-events: none;
    }

    .card-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge {
      position: absolute;
      top: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 24px;
      text-transform: uppercase;
      border: 4px solid;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }

    .badge.like {
      right: 20px;
      color: #00a699;
      border-color: #00a699;
      transform: rotate(15deg);
    }

    .badge.nope {
      left: 20px;
      color: #ff5a5f;
      border-color: #ff5a5f;
      transform: rotate(-15deg);
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding-bottom: 24px;
      z-index: 20;
    }

    .btn-action {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-action:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .btn-nope {
      color: #ff5a5f;
    }

    .btn-like {
      color: #00a699;
    }

    .btn-superlike {
      color: #0084ff;
      width: 48px;
      height: 48px;
      margin-top: 8px;
    }

    /* Desktop Layout Adjustments */
    @media (min-width: 768px) {
      .app-layout {
        display: flex;
        height: 100vh;
      }
      .sidebar {
        width: 380px;
        background: white;
        border-right: 1px solid #eee;
        display: flex;
        flex-direction: column;
      }
      .main-swipe-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f0f2f5;
        position: relative;
      }
    }
  </style>
</head>
<body>

  <!-- Desktop/Tablet Split Layout -->
  <div class="app-layout h-full w-full">

    <!-- Sidebar (Visible only on md+ screens) -->
    <aside class="sidebar hidden md:flex h-full shadow-lg z-10">
      <div class="p-6 border-b border-gray-100 flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-[28px]">restaurant</span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900 tracking-tight">EatWise AI</h1>
          <p class="text-sm text-gray-500 font-medium">Đã khớp 0 món ăn</p>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Các món đã thích</h2>
        <div id="matched-items" class="flex flex-col gap-4">
          <div class="text-center text-gray-400 mt-10">
            <span class="material-symbols-outlined text-[48px] mb-2 opacity-50">swipe_right</span>
            <p>Vuốt phải để thích món ăn.<br>Món ăn bạn thích sẽ xuất hiện ở đây.</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Swipe Area -->
    <main class="main-swipe-area flex-1 h-full w-full flex flex-col relative">

      <!-- Mobile Header -->
      <header class="md:hidden flex items-center justify-between p-4 bg-white/80 backdrop-blur-md z-10 shadow-sm fixed top-0 w-full">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-[24px]">restaurant</span>
          </div>
          <span class="font-bold text-lg text-gray-900">EatWise</span>
        </div>
        <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 relative">
          <span class="material-symbols-outlined">favorite</span>
          <span id="mobile-match-count" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center hidden">0</span>
        </button>
      </header>

      <!-- Cards Container -->
      <div class="tinder-cards flex-1 pt-16 md:pt-0" id="card-container">
        <!-- Cards will be injected by JS -->
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons mb-safe pb-4 md:pb-8">
        <button class="btn-action btn-nope" id="btn-nope">
          <span class="material-symbols-outlined text-[32px]">close</span>
        </button>
        <button class="btn-action btn-superlike" id="btn-superlike">
          <span class="material-symbols-outlined text-[24px]">star</span>
        </button>
        <button class="btn-action btn-like" id="btn-like">
          <span class="material-symbols-outlined text-[32px]">favorite</span>
        </button>
      </div>

    </main>
  </div>

  <script>
    const dishes = [
      {
        id: 1,
        name: "Bún Bò Huế Đặc Biệt Nước Trong",
        restaurant: "Bún Bò O Xuân • 850m",
        price: "55.000đ",
        calories: "480 kcal",
        match: "98% Hợp khẩu vị",
        reason: "Thơm cay tự nhiên, quán có tùy chọn bỏ sạch hành lá.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuBOSTA7hDbuk_rGP1tQEJ90IZXS5i4R2vr7dHMZ43z1TLBmPYcPJ9nn6l0Dz62ir2-T8SN_gVHHv5lBSh9QXENMs_9hRwYdubwBpScaTciClmU9koFVCtBL3U8B6D3wGUXhnkNUCwn3-wofoCXuKCDB06NawF3HV9tIVfUuO_lNhuhF4zbWr-dRuvPuPQFvBS8XOB8ZGJgmopoxl3Uwo2kh7QR3KbBPYXwgj8MGBZZXdVy2qst7E6rIUA"
      },
      {
        id: 2,
        name: "Phở Bò Tái Lăn Hà Nội",
        restaurant: "Phở Gia Truyền Bát Đàn • 1.2km",
        price: "60.000đ",
        calories: "520 kcal",
        match: "96% Hợp khẩu vị",
        reason: "Cam kết chuẩn ghi chú 'Không Hành'.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuBzsEFS927aTNSeVnrSKK9Y9AZbE6XLzVY-44TLi7WELhBJ1P5sgch2uGQSKXfymOBaL5f6FZKR7A6HO0noMj64gRks7r0WW7fT98M7KgcAykduV4dCbQwhVwRVEIGlLD6RWZakRY0-rr2wWuRTkbix9xKu5cLe3aSjMMLlYJFcQqzTZkcTuebcdw5Iih_faCF-tVog5mRO0hVIByhCLWuMEkIusR8vZftEhObxfENQZWdjX2WddaxHiA"
      },
      {
        id: 3,
        name: "Cơm Tấm Sườn Bì Chả Nướng",
        restaurant: "Cơm Tấm Ba Ghiền • 1.8km",
        price: "50.000đ",
        calories: "610 kcal",
        match: "94% Hợp khẩu vị",
        reason: "Sườn ướp mật ong nướng than củi tuyệt hảo.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuADf4981ZUGHmBB2FhQbxqqAxS7sTRY4hC79A_gPixa56Z0V3EbWdfmjA7Z4HcM8Y8pX_QHnV9pTF0eZLwR2N1YAj6Px-F7qVVT5CNwILacXFopn_EdyGRSfClle8GF2QjfhdXyAKzTSQtAMBYO4wsB-Ms1N9Lp0pN3Rj4xCrY7YD5csT22BUu4KqTBxnTa4RoaH-XCXEi1g8g5QJZJ4L5hmwC8zgAwSKPmmO3d4-Uo4kezZDMPWV-mdQ"
      },
      {
        id: 4,
        name: "Miến Gà Ta Nước Dùng Thanh",
        restaurant: "Gà Ta Quán • 600m",
        price: "45.000đ",
        calories: "390 kcal",
        match: "100% An toàn",
        reason: "Gà đồi thả vườn, nước dùng không phụ gia.",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuD5yypFSv-r1eV4mLb9Ntf6RhdFXZ0LaKn2luRyMjdxdrho0t2U7XFwc51Zs7oNvCHs7CKjltI91tAbTtazaasGwTReX2-DihBR6a5gJJGNqOln_Zp1d021a8fjs-8Fm77j9UcaNJ60c-QnLn7mNQ0TYHLM058fff1Yenxp0GRYCf2dhUZ77kAcpTRIRDO_JcWLGy5gW7kVE5wdcUTBTrVpzo4DglrnuRJyF5tb56wdmlglm-PvJLxM1g"
      }
    ];

    const container = document.getElementById('card-container');
    const matchedItemsContainer = document.getElementById('matched-items');
    let matchedCount = 0;

    // Reverse array so the first item is on top in DOM
    const dishesReversed = [...dishes].reverse();

    function createCard(dish) {
      const card = document.createElement('div');
      card.className = 'tinder-card';
      card.dataset.id = dish.id;

      card.innerHTML = `
        <div class="badge like">LIKE</div>
        <div class="badge nope">NOPE</div>
        <img src="${dish.image}" alt="${dish.name}" />

        <!-- Gradient Overlay -->
        <div class="absolute inset-0 top-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent pointer-events-none"></div>

        <!-- Match Badge -->
        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md z-10">
          <span class="material-symbols-outlined text-[16px] text-secondary">verified</span>
          <span class="text-sm font-bold text-gray-800">${dish.match}</span>
        </div>

        <div class="card-content relative z-10 text-white pb-6">
          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-end">
              <h2 class="text-2xl font-bold leading-tight drop-shadow-md pr-2">${dish.name}</h2>
              <span class="text-xl font-extrabold text-primary drop-shadow-md shrink-0">${dish.price}</span>
            </div>
            <div class="flex items-center gap-2 text-gray-200 text-sm mt-1">
              <span class="material-symbols-outlined text-[16px]">storefront</span>
              <span class="font-medium">${dish.restaurant}</span>
              <span>• ${dish.calories}</span>
            </div>

            <div class="mt-3 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 flex gap-2 items-start">
              <span class="material-symbols-outlined text-secondary text-[20px] shrink-0">neurology</span>
              <p class="text-sm font-medium leading-snug">
                <span class="text-secondary font-bold">Lý do gợi ý:</span> ${dish.reason}
              </p>
            </div>
          </div>
        </div>
      `;
      return card;
    }

    function initCards() {
      dishesReversed.forEach((dish, index) => {
        const card = createCard(dish);
        // Stack effect
        const scale = 1 - (dishesReversed.length - 1 - index) * 0.04;
        const translateY = (dishesReversed.length - 1 - index) * -15;
        card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
        card.style.zIndex = index;
        container.appendChild(card);
      });
      setupDrag();
    }

    function addMatchedItem(dishId) {
      const dish = dishes.find(d => d.id == dishId);
      if(!dish) return;

      matchedCount++;
      const sidebarHeader = document.querySelector('.sidebar p');
      if(sidebarHeader) sidebarHeader.innerText = `Đã khớp ${matchedCount} món ăn`;

      const mobileBadge = document.getElementById('mobile-match-count');
      if(mobileBadge) {
        mobileBadge.innerText = matchedCount;
        mobileBadge.classList.remove('hidden');
      }

      if(matchedCount === 1) {
        matchedItemsContainer.innerHTML = ''; // Clear placeholder
      }

      const itemHtml = `
        <div class="flex gap-3 bg-white border border-gray-100 rounded-xl p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
          <img src="${dish.image}" class="w-16 h-16 rounded-lg object-cover" />
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-gray-900 truncate">${dish.name}</h4>
            <p class="text-sm text-gray-500 truncate">${dish.restaurant}</p>
            <div class="text-primary font-bold text-sm mt-1">${dish.price}</div>
          </div>
        </div>
      `;
      matchedItemsContainer.insertAdjacentHTML('afterbegin', itemHtml);
    }

    let currentCard;

    function setupDrag() {
      const cards = document.querySelectorAll('.tinder-card:not(.removed)');
      if (cards.length === 0) {
        // Show empty state
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center text-gray-400 p-8 text-center">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
              <span class="material-symbols-outlined text-[40px] text-gray-300">restaurant_menu</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Đã hết món ăn gợi ý</h3>
            <p class="text-gray-500 max-w-xs">AI đang tìm kiếm thêm các món mới quanh khu vực của bạn. Hãy quay lại sau nhé!</p>
            <button class="mt-6 px-6 py-3 bg-primary text-white font-bold rounded-full shadow-lg" onclick="location.reload()">Khám phá lại</button>
          </div>
        `;
        return;
      }

      currentCard = cards[cards.length - 1]; // Top card

      let isDragging = false;
      let startX = 0, startY = 0;
      let currentX = 0, currentY = 0;

      const badgeLike = currentCard.querySelector('.badge.like');
      const badgeNope = currentCard.querySelector('.badge.nope');

      const handlePointerDown = (e) => {
        isDragging = true;
        startX = e.clientX || e.touches[0].clientX;
        startY = e.clientY || e.touches[0].clientY;
        currentCard.classList.add('moving');
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const x = e.clientX || e.touches[0].clientX;
        const y = e.clientY || e.touches[0].clientY;

        currentX = x - startX;
        currentY = y - startY;

        const rotate = currentX * 0.05;
        currentCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

        // Show badges based on drag distance
        if (currentX > 0) {
          badgeLike.style.opacity = Math.min(currentX / 100, 1);
          badgeNope.style.opacity = 0;
        } else {
          badgeNope.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
          badgeLike.style.opacity = 0;
        }
      };

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        currentCard.classList.remove('moving');

        const threshold = window.innerWidth * 0.25;

        if (currentX > threshold) {
          swipeCard('right');
        } else if (currentX < -threshold) {
          swipeCard('left');
        } else {
          // Reset
          currentCard.style.transform = '';
          badgeLike.style.opacity = 0;
          badgeNope.style.opacity = 0;
        }

        currentX = 0;
        currentY = 0;
      };

      currentCard.addEventListener('mousedown', handlePointerDown);
      currentCard.addEventListener('touchstart', handlePointerDown, {passive: true});

      document.addEventListener('mousemove', handlePointerMove);
      document.addEventListener('touchmove', handlePointerMove, {passive: true});

      document.addEventListener('mouseup', handlePointerUp);
      document.addEventListener('touchend', handlePointerUp);

      // Save handlers so we can remove them if needed
      currentCard._handlers = { handlePointerDown, handlePointerMove, handlePointerUp };
    }

    function swipeCard(direction) {
      if(!currentCard) return;

      const card = currentCard;
      const x = direction === 'right' ? window.innerWidth : -window.innerWidth;
      const rotate = direction === 'right' ? 30 : -30;

      card.style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
      card.style.transform = `translate(${x}px, -50px) rotate(${rotate}deg)`;
      card.style.opacity = '0';
      card.classList.add('removed');

      // Cleanup events
      if(card._handlers) {
        document.removeEventListener('mousemove', card._handlers.handlePointerMove);
        document.removeEventListener('touchmove', card._handlers.handlePointerMove);
        document.removeEventListener('mouseup', card._handlers.handlePointerUp);
        document.removeEventListener('touchend', card._handlers.handlePointerUp);
      }

      if (direction === 'right') {
        addMatchedItem(card.dataset.id);
      }

      setTimeout(() => {
        card.remove();
        updateStack();
        setupDrag();
      }, 300);
    }

    function updateStack() {
      const cards = document.querySelectorAll('.tinder-card:not(.removed)');
      cards.forEach((card, index) => {
        const scale = 1 - (cards.length - 1 - index) * 0.04;
        const translateY = (cards.length - 1 - index) * -15;
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
      });
    }

    document.getElementById('btn-nope').addEventListener('click', () => {
      const badgeNope = currentCard?.querySelector('.badge.nope');
      if(badgeNope) badgeNope.style.opacity = 1;
      swipeCard('left');
    });

    document.getElementById('btn-like').addEventListener('click', () => {
      const badgeLike = currentCard?.querySelector('.badge.like');
      if(badgeLike) badgeLike.style.opacity = 1;
      swipeCard('right');
    });

    document.getElementById('btn-superlike').addEventListener('click', () => {
      const badgeLike = currentCard?.querySelector('.badge.like');
      if(badgeLike) {
        badgeLike.innerText = "SUPER!";
        badgeLike.style.color = "#0084ff";
        badgeLike.style.borderColor = "#0084ff";
        badgeLike.style.opacity = 1;
      }
      swipeCard('right');
    });

    // Init
    initCards();
  </script>
</body>
</html>
